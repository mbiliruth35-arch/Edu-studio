<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>


<link rel="icon" type="image/png" sizes="100x100" href="icon.png">



<style> * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }

body { min-height: 100vh; display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, #667eea, #764ba2); }

.container { width: 90%; max-width: 400px; background: white; padding: 35px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); }

h1 { text-align: center; color: #333; margin-bottom: 10px; }

.subtitle { text-align: center; color: #777; margin-bottom: 30px; }

label { display: block; margin-bottom: 7px; font-weight: bold; color: #333; }

input { width: 100%; padding: 13px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; outline: none; }

input:focus { border-color: #667eea; }

button { width: 100%; padding: 13px; border: none; border-radius: 8px; background: #667eea; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }

button:hover { background: #5568d9; }

button:disabled { background: #aaa; cursor: not-allowed; }

.message { margin-bottom: 15px; padding: 10px; border-radius: 7px; text-align: center; display: none; }

.error { display: block; background: #ffe5e5; color: #c00; }

.success { display: block; background: #e5ffe9; color: green; }

.link { text-align: center; margin-top: 20px; color: #777; }

.link a { color: #667eea; text-decoration: none; font-weight: bold; 
} 
.but{
    background-color: #1a36d5;
}

</style> </head>

<body>

<div class="container">

<h1>Welcome Back</h1>

<p class="subtitle">Login to your account</p>

<div id="message" class="message"></div>

<form id="loginForm">

<label for="email">Email</label>

<input type="email" id="email" placeholder="Enter your email" required >

<label for="password">Password</label>

<input type="password" id="password" placeholder="Enter your password" required >

<button type="submit" class="but"id="loginButton"> Login </button>

</form>

<div class="link"> Don't have an account? <a href="register.html">Create an account</a> </div>

</div>

<div class="footer">
  Created by
  <a href="https://www.instagram.com/jones_teo_the_great/" target="_blank" rel="noopener noreferrer">
    Inno Jones
  </a>
</div>

<style>
.footer {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  padding: 10px;
  text-align: center;
  background: #fff;
  color: #777;
  font-size: 12px;
  border-top: 1px solid #eee;
}

.footer a {
  color: #000;
  text-decoration: none;
  font-weight: 600;
}

.footer a:hover {
  text-decoration: underline;
}
</style>


<script>



const form = document.getElementById("loginForm");
const button = document.getElementById("loginButton");
const message = document.getElementById("message");

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    message.className = "message";
    message.textContent = "";

    button.disabled = true;
    button.textContent = "Logging in...";

    try {
        const response = await fetch("http://127.0.0.1:8000/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
            message.className = "message error";
            message.textContent = data.detail || "Login failed.";
            return;
        }

        if (!data.user) {
            message.className = "message error";
            message.textContent = "Login response is missing user data.";
            return;
        }

        message.className = "message success";
        message.textContent = "Login successful!";

        localStorage.setItem("user", JSON.stringify(data.user));

        setTimeout(function() {
            window.location.href = "/live.html";
        }, 1000);

    } catch (error) {
        message.className = "message error";
        message.textContent =
            "Could not connect to the server. Check that your backend is running.";

        console.error("Login error:", error);

    } finally {
        button.disabled = false;
        button.textContent = "Login";
    }
});
</script>


</body> </html>
