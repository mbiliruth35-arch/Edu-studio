<!DOCTYPE html> <html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edu-studio</title>

<link rel="icon" type="image/png" sizes="100x100" href="icon.png">


<style>







.like-count {
    font-size: 12px;
    font-weight: 600;
}

.edu-action:disabled {
    opacity: 0.6;
    cursor: wait;
}

.comment-item small {
    display: block;
    margin-top: 6px;
    color: #777;
    font-size: 11px;
}


/* UPLOADER PROFILE */
.edu-author {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 15px 18px;
    background: #fff;
    border-bottom: 1px solid #eee;
}

.edu-author-avatar {
    width: 43px;
    height: 43px;
    flex-shrink: 0;
    border-radius: 50%;
    overflow: hidden;
    background: #e8e8e8;
    display: grid;
    place-items: center;
    color: #222;
    font-size: 15px;
    font-weight: 700;
}

.edu-author-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.edu-author-info {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.edu-author-name {
    font-size: 14px;
    font-weight: 700;
    color: #111;
    overflow-wrap: anywhere;
}

.edu-author-label {
    font-size: 11px;
    color: #777;
}

.edu-card .edu-preview {
    border-bottom: 1px solid #eee;
}






.content-feed {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
    gap: 20px;
    margin-bottom: 40px;
}

.feed-status {
    color: #666;
    padding: 20px 0;
}

.edu-card {
    overflow: hidden;
    border-radius: 24px;
    background: #f7f7f7;
    border: 1px solid #e9e9e9;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .05);
    transition: transform .2s, box-shadow .2s;
}

.edu-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 22px rgba(0, 0, 0, .09);
}

.edu-card-main {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 22px;
    min-height: 145px;
    cursor: pointer;
}

.edu-file-icon {
    width: 62px;
    height: 72px;
    flex-shrink: 0;
    border-radius: 15px;
    background: #fff;
    display: grid;
    place-items: center;
    color: #111;
    border: 1px solid #e5e5e5;
}

.edu-file-icon svg {
    width: 32px;
    height: 32px;
}

.edu-info {
    min-width: 0;
    flex: 1;
}

.edu-info h2 {
    font-size: 17px;
    overflow-wrap: anywhere;
    margin-bottom: 8px;
}

.edu-info p {
    color: #777;
    font-size: 12px;
    line-height: 1.5;
}

.edu-card-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 18px;
    border-top: 1px solid #e5e5e5;
    background: #fff;
}

.edu-action {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    min-height: 38px;
    padding: 0 12px;
    border: none;
    border-radius: 22px;
    background: #f1f1f1;
    color: #111;
    cursor: pointer;
    font-size: 13px;
}

.edu-action svg {
    width: 19px;
    height: 19px;
}

.edu-action:hover {
    background: #e4e4e4;
}

.edu-action.liked {
    color: #d21f3c;
    background: #fff0f2;
}

.edu-action.liked svg {
    fill: #d21f3c;
}

.edu-action.open-action {
    margin-left: auto;
}

.comment-panel {
    padding: 16px;
    border-top: 1px solid #e5e5e5;
    background: #fff;
}

.comment-panel[hidden] {
    display: none;
}

.comment-list {
    display: grid;
    gap: 12px;
    margin-bottom: 14px;
}

.comment-item {
    padding: 10px 12px;
    border-radius: 12px;
    background: #f7f7f7;
    overflow-wrap: anywhere;
}

.comment-item strong {
    display: block;
    font-size: 13px;
    margin-bottom: 4px;
}

.comment-item p {
    font-size: 14px;
    line-height: 1.5;
}

.comment-form {
    display: flex;
    gap: 8px;
}

.comment-form input {
    width: 100%;
    min-width: 0;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 12px;
    outline: none;
}

.comment-form button {
    border: none;
    border-radius: 12px;
    padding: 0 15px;
    background: #000;
    color: #fff;
    cursor: pointer;
}

@media (max-width: 480px) {
    .content-feed {
        grid-template-columns: 1fr;
        gap: 15px;
    }

/* EDUCATIONAL CONTENT PREVIEWS */

.edu-preview {
    width: 100%;
    height: 220px;

    border-bottom: 1px solid #e5e5e5;
    overflow: hidden;
    position: relative;
}

.edu-preview img,
.edu-preview video,

    display: block;
    width: 100%;
    height: 100%;
    border: 0;

}

.edu-preview img {
    object-fit: cover;
    cursor: pointer;
    background: #f4f4f4;
}

.edu-preview video {
    object-fit: cover;
    background: #111;
}

.edu-preview iframe {

}

.edu-preview-placeholder {
    display: flex;

    justify-content: center;
    flex-direction: column;
    gap: 10px;
    height: 100%;
    color: #555;

}

.edu-preview-placeholder svg {
    width: 44px;

}

.edu-card-actions .edu-action {

}

.edu-card-actions .read-action {
    background: #111;

.edu-card-actions .read-action:hover {
    background: #333;
}

    }

gap: 3px; }

<script>
"use strict";

// ============================================================
// CONFIGURATION AND USER AUTHENTICATION
// ============================================================

const API_BASE = "https://edu-studio-681e.onrender.com";

let user = null;

try {
    const savedUser = localStorage.getItem("user");
    user = savedUser ? JSON.parse(savedUser) : null;
} catch (error) {
    console.error("Could not read saved user:", error);
    localStorage.removeItem("user");
}

if (!user || !user.id) {
    window.location.replace("/sample.html");
}

// ============================================================
// NAVIGATION
// ============================================================

function goHome() {
    window.location.href = "/live.html";
}

function goSearch() {
    window.location.href = "/search.html";
}

function goDiscover() {
    window.location.href = "/discover.html";
}

function goProfile() {
    window.location.href = "/profile.html";
}

function addContent() {
    window.location.href = "/add-content.html";
}

function logout() {
    localStorage.removeItem("user");
    window.location.href = "/sample.html";
}

// ============================================================
// SHARE
// ============================================================

async function sharePost() {
    const shareData = {
        title: "Edu-studio",
        text: "Check out Edu-studio!"
    };

    try {
        if (navigator.share) {
            await navigator.share(shareData);
        } else if (navigator.clipboard) {
            await navigator.clipboard.writeText(
                `${shareData.title}: ${shareData.text}`
            );
            alert("Share text copied!");
        } else {
            alert("Sharing is not supported on this device.");
        }
    } catch (error) {
        if (error.name !== "AbortError") {
            console.error("Sharing failed:", error);
        }
    }
}

// ============================================================
// HELPER FUNCTIONS
// ============================================================

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function icon(name) {
    return `
        <svg viewBox="0 0 24 24"
             aria-hidden="true"
             fill="none">
            <use href="#icon-${name}"></use>
        </svg>
    `;
}

function extensionOf(filename) {
    return String(filename || "")
        .split(".")
        .pop()
        .toLowerCase();
}

function formatDate(dateString) {
    if (!dateString) return "";

    const date = new Date(dateString);

    return Number.isNaN(date.getTime())
        ? ""
        : date.toLocaleDateString();
}

async function readResponse(response) {
    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
        throw new Error(
            data.detail || `Request failed (${response.status})`
        );
    }

    return data;
}





async function getContentLikes(contentId) {
    const response = await fetch(
        `${API_BASE}/content/${encodeURIComponent(contentId)}/likes` +
        `?user_id=${encodeURIComponent(user.id)}`
    );

    return await readResponse(response);
}

async function toggleContentLike(button) {
    if (!user || !user.id) {
        alert("Please log in to like content.");
        return;
    }

    const contentId = button.dataset.contentLike;
    const wasLiked = button.dataset.liked === "true";

    button.disabled = true;

    try {
        const response = await fetch(
            `${API_BASE}/content/${encodeURIComponent(contentId)}/like` +
            `?user_id=${encodeURIComponent(user.id)}`,
            { method: wasLiked ? "DELETE" : "POST" }
        );

        await readResponse(response);

        const result = await getContentLikes(contentId);

        button.dataset.liked = String(result.liked);
        button.classList.toggle("liked", result.liked);
        button.querySelector(".like-label").textContent =
            result.liked ? "Liked" : "Like";
        button.querySelector(".like-count").textContent =
            result.likes_count;
        button.setAttribute("aria-pressed", String(result.liked));
    } catch (error) {
        alert(error.message || "Could not update like.");
    } finally {
        button.disabled = false;
    }
}

async function loadContentComments(contentId, listElement) {
    listElement.innerHTML =
        '<p class="feed-status">Loading comments...</p>';

    try {
        const response = await fetch(
            `${API_BASE}/content/${encodeURIComponent(contentId)}/comments`
        );

        const comments = await readResponse(response);

        if (!Array.isArray(comments)) {
            throw new Error("Invalid comments response.");
        }

        if (comments.length === 0) {
            listElement.innerHTML =
                '<p class="feed-status">No comments yet.</p>';
            return;
        }

        listElement.innerHTML = comments.map(comment => `
            <div class="comment-item">
                <strong>${escapeHTML(comment.username || "User")}</strong>
                <p>${escapeHTML(comment.content)}</p>
                <small>${escapeHTML(formatDate(comment.created_at))}</small>
            </div>
        `).join("");
    } catch (error) {
        listElement.innerHTML =
            `<p class="feed-status">${escapeHTML(error.message)}</p>`;
    }
}

async function addContentComment(contentId, content) {
    if (!user || !user.id) {
        throw new Error("Please log in to comment.");
    }

    const response = await fetch(
        `${API_BASE}/content/${encodeURIComponent(contentId)}/comments`,
        {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                user_id: user.id,
                content: content.trim()
            })
        }
    );

    return await readResponse(response);
}











function getPreviewHTML(item) {
    const id = encodeURIComponent(item.id);
    const extension = String(item.original_filename || "")
        .split(".")
        .pop()
        .toLowerCase();

    const url = `${API_BASE}/content/${id}/preview`;

    if (["jpg", "jpeg", "png"].includes(extension)) {
        return `
            <div class="edu-preview">
                <img
                    src="${url}"
                    alt="${escapeHTML(item.name || "Educational image")}"
                    loading="lazy"
                    data-preview="${escapeHTML(item.id)}"
                >
            </div>
        `;
    }

    if (extension === "pdf") {
        return `
            <div class="edu-preview">
                <iframe
                    src="${url}#page=1&toolbar=0&navpanes=0"
                    title="First page of ${escapeHTML(item.name || "PDF")}"
                    loading="lazy">
                </iframe>
            </div>
        `;
    }

    if (extension === "mp4") {
        return `
            <div class="edu-preview">
                <video controls preload="metadata">
                    <source src="${url}" type="video/mp4">
                    Your browser does not support video playback.
                </video>
            </div>
        `;
    }

    const labels = {
        txt: "Text document",
        doc: "Word document",
        docx: "Word document",
        ppt: "PowerPoint presentation",
        pptx: "PowerPoint presentation"
    };

    const label = labels[extension] || "Educational file";

    const previewIcon = extension === "txt" ? "file" : "book";

    return `
        <div class="edu-preview">
            <div class="edu-preview-placeholder">
                ${icon(previewIcon)}
                <strong>${escapeHTML(label)}</strong>
                <span>${escapeHTML(item.original_filename || "")}</span>
            </div>
        </div>
    `;
}

const url = `${API_BASE}/content/${id}/preview`;

// ============================================================
// LOAD EDUCATIONAL CONTENT WITH PREVIEWS
// ============================================================

async function loadContent() {
    const feed = document.getElementById("content-feed");

    if (!feed) return;

    feed.innerHTML = `
        <p class="feed-status">Loading educational content...</p>
    `;

    try {
        







        
const response = await fetch(`${API_BASE}/content`);
const items = await readResponse(response);

if (!response.ok) {
    throw new Error("Could not load educational content.");
}

// Retrieve the like count and current user's status for each item.
// A failure to load likes should not hide the document itself.
const itemsWithLikes = await Promise.all(
    items.map(async item => {
        try {
            const likes = await getContentLikes(item.id);
            return { ...item, likes };
        } catch (error) {
            console.error(
                `Could not load likes for content ${item.id}:`,
                error
            );

            return {
                ...item,
                likes: { likes_count: 0, liked: false }
            };
        }
    })
);


        if (!Array.isArray(items)) {
            throw new Error("Invalid content response from server.");
        }

        if (items.length === 0) {
            feed.innerHTML = `
                <p class="feed-status">
                    No educational content yet.
                    Use the + button to upload your first document.
                </p>
            `;
            return;
        }

        feed.innerHTML = itemsWithLikes.map(item => {
            const id = escapeHTML(item.id);
            const name = escapeHTML(item.name || "Untitled content");
            const filename = escapeHTML(
                item.original_filename || "Educational file"
            );
            const date = escapeHTML(formatDate(item.created_at));

        
          
return `
    <article class="edu-card">

        <!-- UPLOADER PROFILE -->
        <div class="edu-author">
            <div class="edu-author-avatar">
                ${
                    item.uploader_profile_pic
                        ? `<img
                            src="${escapeHTML(
                                item.uploader_profile_pic.startsWith("http")
                                    ? item.uploader_profile_pic
                                    : `${API_BASE}${item.uploader_profile_pic}`
                            )}"
                            alt="${escapeHTML(
                                item.uploader_username || "User"
                            )}'s profile picture"
                            onerror="this.remove()"
                        >`
                        : escapeHTML(
                            (item.uploader_username || "U")
                                .charAt(0)
                                .toUpperCase()
                        )
                }
            </div>

            <div class="edu-author-info">
                <span class="edu-author-name">
                    ${escapeHTML(
                        item.uploader_username || "Unknown user"
                    )}
                </span>

                <span class="edu-author-label">
                    Posted this educational content
                </span>
            </div>
        </div>

        <!-- CONTENT PREVIEW -->
        ${getPreviewHTML(item)}

        <!-- CONTENT DETAILS -->
        <div
            class="edu-card-main"
            role="link"
            tabindex="0"
            data-open="${id}"
            aria-label="Read ${name}"
        >
            <div class="edu-info">
                <h2>${name}</h2>
                <p>${filename}</p>
                <p>${date ? `Added ${date}` : ""}</p>
            </div>
        </div>

        <!-- ACTION BUTTONS -->
        <div class="edu-card-actions">

            <button
                class="edu-action read-action"
                type="button"
                data-open="${id}"
            >
                Read
            </button>

            <button
                class="edu-action ${item.likes.liked ? "liked" : ""}"
                type="button"
                data-content-like="${id}"
                data-liked="${item.likes.liked}"
                aria-pressed="${item.likes.liked}"
            >
                ${icon("heart")}
                <span class="like-label">
                    ${item.likes.liked ? "Liked" : "Like"}
                </span>
                <span class="like-count">
                    ${item.likes.likes_count}
                </span>
            </button>

            <button
                class="edu-action"
                type="button"
                data-content-comments="${id}"
            >
                ${icon("comment")}
                <span>Comments</span>
            </button>

        </div>

        <!-- COMMENTS -->
        <div
            class="comment-panel"
            id="content-comments-${id}"
            hidden
        >
            <div class="comment-list"></div>

            <form
                class="comment-form"
                data-comment-form="${id}"
            >
                <input
                    type="text"
                    name="content"
                    placeholder="Write a comment..."
                    maxlength="2000"
                    required
                    aria-label="Write a comment"
                >

                <button type="submit">Send</button>
            </form>
        </div>

    </article>
`;
 }).join("");

    } catch (error) {
        console.error("Content loading failed:", error);

        feed.innerHTML = `
            <div class="feed-status">
                <p>Could not load educational content.</p>
                <p>${escapeHTML(error.message)}</p>
                <button class="edu-action"
                        type="button"
                        id="retry-content">
                    Try again
                </button>
            </div>
        `;
    }
}


// ============================================================
// EDUCATIONAL CONTENT FEED EVENTS
// ============================================================

const contentFeed = document.getElementById("content-feed");

if (contentFeed) {
    contentFeed.addEventListener("click", async event => {
        const target = event.target;

        const retryButton = target.closest("#retry-content");
        if (retryButton) {
            await loadContent();
            return;
        }

        const imagePreview = target.closest("[data-preview]");
        if (imagePreview) {
            openContent(imagePreview.dataset.preview);
            return;
        }

        const openButton = target.closest("[data-open]");
        if (openButton) {
            openContent(openButton.dataset.open);
            return;
        }

        const likeButton = target.closest("[data-content-like]");
        if (likeButton) {
            await toggleContentLike(likeButton);
            return;
        }

        const commentsButton = target.closest("[data-content-comments]");
        if (commentsButton) {
            const id = commentsButton.dataset.contentComments;
            const panel = document.getElementById(`content-comments-${id}`);

            if (!panel) return;

            panel.hidden = !panel.hidden;

            if (!panel.hidden) {
                await loadContentComments(
                    id,
                    panel.querySelector(".comment-list")
                );
            }
        }
    });

    contentFeed.addEventListener("keydown", event => {
        const card = event.target.closest(".edu-card-main[data-open]");

        if (
            card &&
            (event.key === "Enter" || event.key === " ")
        ) {
            event.preventDefault();
            openContent(card.dataset.open);
        }
    });

    contentFeed.addEventListener("submit", async event => {
        const form = event.target.closest("[data-comment-form]");
        if (!form) return;

        event.preventDefault();

        const input = form.querySelector('input[name="content"]');
        const sendButton = form.querySelector('button[type="submit"]');
        const contentId = form.dataset.commentForm;

        if (!input.value.trim()) return;

        sendButton.disabled = true;

        try {
            await addContentComment(contentId, input.value);
            input.value = "";

            const panel = document.getElementById(
                `content-comments-${contentId}`
            );

            if (panel) {
                await loadContentComments(
                    contentId,
                    panel.querySelector(".comment-list")
                );
            }
        } catch (error) {
            alert(error.message || "Could not add comment.");
        } finally {
            sendButton.disabled = false;
        }
    });
}

    }

    try {

            `${API_BASE}/posts/${encodeURIComponent(postId)}/like` +

            { method: "POST" }
        );

        await readResponse(response);
        alert("Post liked successfully!");
    } catch (error) {
        alert(error.message || "Could not like this post.");

}

async function unlikePost(postId) {
    if (!user || !user.id) return;

    try {
        const response = await fetch(
            `${API_BASE}/posts/${encodeURIComponent(postId)}/like` +
            `?user_id=${encodeURIComponent(user.id)}`,
            { method: "DELETE" }
        );

        await readResponse(response);
        alert("Like removed.");
    } catch (error) {
        alert(error.message || "Could not remove like.");
    }
}

// ============================================================
// LOAD COMMENTS FOR A SOCIAL-MEDIA POST
// Requires GET /posts/{id}/comments
// ============================================================

async function loadComments(postId, targetList) {
    if (!targetList) return;

    targetList.innerHTML = `
        <p class="feed-status">Loading comments...</p>
    `;

    try {
        const response = await fetch(
            `${API_BASE}/posts/${encodeURIComponent(postId)}/comments`
        );

        const comments = await readResponse(response);

        if (!Array.isArray(comments) || comments.length === 0) {
            targetList.innerHTML = `
                <p class="feed-status">No comments yet.</p>
            `;
            return;
        }

        targetList.innerHTML = comments.map(comment => `
            <div class="comment-item">
                <strong>${escapeHTML(comment.username || "User")}</strong>
                <p>${escapeHTML(comment.content)}</p>
            </div>
        `).join("");

    } catch (error) {
        console.error("Could not load comments:", error);

        targetList.innerHTML = `
            <p class="feed-status">
                ${escapeHTML(error.message)}
            </p>
        `;
    }
}

// ============================================================
// ADD A COMMENT TO A SOCIAL-MEDIA POST
// Requires POST /posts/{id}/comments
// ============================================================

async function addPostComment(postId, content) {
    if (!user || !user.id) {
        throw new Error("Please log in to comment.");
    }

    const response = await fetch(
        `${API_BASE}/posts/${encodeURIComponent(postId)}/comments`,
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                user_id: user.id,
                content: content.trim()
            })
        }
    );

    return await readResponse(response);
}
